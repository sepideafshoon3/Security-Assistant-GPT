name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff + black + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-core

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api-core/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run black (check only)
        run: black --check .

      - name: Run pytest
        run: pytest

  backend-postgres-smoke:
    name: Backend (Postgres smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-core
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api-core/pyproject.toml

      - name: Install dependencies (with postgres driver)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[postgres]"

      - name: Run migrations + write/read round-trip against real Postgres
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/security_assistant
        run: ./scripts/check_db.sh

  frontend:
    name: Frontend (eslint + prettier + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-console

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

      - name: Run prettier (check only)
        run: npm run format:check

      - name: Build (type-check + bundle)
        run: npm run build
