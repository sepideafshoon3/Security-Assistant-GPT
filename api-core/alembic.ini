# Alembic configuration for api-core.
#
# The database URL is NOT set here: migrations/env.py takes it from
# src.db.session (DATABASE_URL env var, default local SQLite file), so the
# app and the `alembic` CLI always talk to the same database.
#
# Run all commands from the api-core/ directory, e.g.:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
