server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed filenames (vite's default asset naming) are safe to cache
    # forever; index.html is not, since it's what points at the current
    # hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No client-side router here today, but this keeps a direct hit on
    # any path (a deep link, a refresh) resolving to the app instead of
    # nginx's 404 -- cheap to have, harmless if unused.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
